*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:10px}
h2,.btn,.hud b{font-family:"Baloo 2",system-ui,sans-serif;margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.hud{display:grid;grid-template-columns:1.5fr .8fr .6fr;gap:8px;font-size:.8rem;color:var(--mute)}
.hud b{display:block;color:var(--ink);font-size:1.05rem}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--hp);transition:width .3s}
.bar.m i{background:var(--leaf)}
.items{display:flex;gap:8px;margin-top:8px}
.items button,.pad button{border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;font:inherit;cursor:pointer;touch-action:manipulation}
.items button:disabled{opacity:.45}
.quest{margin-top:6px;font-size:.85rem;color:var(--mute)}
#view{position:relative;touch-action:none;border-radius:12px;overflow:hidden;border:2px solid var(--line);line-height:0}
#view canvas:not(#mm){width:100%!important;height:auto!important;display:block}
.btn{font-size:1rem;text-align:left;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;line-height:1.3;margin-top:7px}
.btn:hover:not(:disabled){border-color:var(--ice)}
.btn:focus-visible,.items button:focus-visible,.pad button:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.btn:disabled{opacity:.5}
.btn.bad{border-color:var(--bad);background:var(--badbg)}
.btn.ok{border-color:var(--ok);background:var(--okbg)}
.btn.go{background:var(--leaf);color:#fff;border-color:var(--leaf);text-align:center}
.who{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.who span{font-size:2.2rem;line-height:1}
.fb{border-radius:12px;padding:8px 12px;margin-top:8px}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb p{margin:.2em 0}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center}
.pad button{font-size:1.4rem}
.hint{text-align:center;color:var(--mute);font-size:.82rem;margin:6px 0 0}
.center{text-align:center}
#joy{position:absolute;left:14px;bottom:14px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.7);touch-action:none;z-index:3}
#joy i{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px;border-radius:50%;background:rgba(255,255,255,.8)}
.card{box-shadow:0 4px 0 rgba(0,0,0,.07)}
.btn{transition:transform .12s,border-color .12s}.btn:hover:not(:disabled){transform:translateY(-1px)}
.bar i{background:linear-gradient(90deg,#ff9bb0,var(--hp))}
#mm{position:absolute;left:8px;top:8px;width:120px;height:72px;border-radius:8px;border:2px solid rgba(255,255,255,.85);z-index:3}
#rb{position:absolute;right:8px;top:10px;padding:6px 16px;border-radius:999px;background:rgba(22,50,43,.78);color:#fff;font-family:"Baloo 2",sans-serif;font-size:1rem;line-height:1.3;opacity:0;pointer-events:none;z-index:3}
#rb.on{animation:rb 3.2s ease both}
@keyframes rb{0%{opacity:0;transform:translateY(-8px)}12%,78%{opacity:1;transform:none}100%{opacity:0}}
</style>
